<svg viewBox="0 0 1005 243" xmlns="http://www.w3.org/2000/svg" width="1005" height="243">
  <!-- Floworks logo. Colours and geometry measured from the supplied brand file:
       navy #01265D, orange #FF5D08, circle r=114 at (120,121), wordmark baseline y=165,
       tagline baseline y=223. Solid navy disc (no dashed ring). -->
  <circle cx="120" cy="121" r="114" fill="#01265D"/>

  <!-- FW monogram: scaled to the measured 152x108 box -->
  <g transform="translate(112,159) scale(0.94,1.42)">
    <text x="0" y="0" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif"
          font-weight="700" font-size="104" fill="#FFFFFF">FW</text>
  </g>

  <!-- orange dot, sitting on the baseline to the right of the W -->
  <circle cx="200.5" cy="165" r="10.5" fill="#FF5D08"/>

  <!-- wordmark: FLOW navy / ORKS orange, split at x=639 -->
  <g transform="translate(279,165) scale(0.885,1)">
    <text x="0" y="0" font-family="Liberation Sans, Arial, Helvetica, sans-serif"
          font-weight="700" font-size="141" fill="#01265D">FLOW<tspan fill="#FF5D08">ORKS</tspan></text>
  </g>

  <!-- tagline -->
  <text x="284" y="223" font-family="Liberation Sans, Arial, Helvetica, sans-serif"
        font-weight="400" font-size="34" letter-spacing="11" fill="#01265D">YOUR OPEN SOURCE AI ERP</text>
</svg>
